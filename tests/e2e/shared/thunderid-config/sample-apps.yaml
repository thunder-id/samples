#
# Declarative OAuth2 application registrations for the web sample apps under E2E test that do not
# ship a declarative config of their own, imported with `POST /import` by every web suite's global
# setup (shared/setup/global-setup.ts) and by `thunderid.sh import`. The quickstart clients keep the
# `JS_SDK_E2E_*` IDs the javascript-sdks E2E suite registers, so both suites can share one server.
# The B2B samples (quickstart-react-b2b, quickstart-nextjs-b2b, wayfinder-enterprise-nextjs) import
# their own thunderid-config/thunderid-config.yaml instead.
#
# The trailing server config is the CORS allowlist of every browser app's origin. An import
# replaces the whole list, so it names every app, not only the one a suite tests.
#
# Double-brace placeholders below are filled from the `variables` map passed alongside this file's
# content. shared/apps.ts holds the values, and the port and redirect URIs each app runs with.
#
# Note: this whole file is parsed as a Go template, comments included. Never write a literal
# double-brace placeholder in prose here, even in a comment, or the import fails.

---
resource_type: application
id: 019a0000-0000-7000-8000-0000000000b1
ouHandle: default
name: E2E browser/quickstart
description: OAuth2 client for the browser SDK quickstart's E2E suite
type: browser
authFlowHandle: default-flow
isRegistrationFlowEnabled: false
isRecoveryFlowEnabled: false
isSignOutFlowEnabled: false
assertion:
  validityPeriod: 3600
loginConsent:
  validityPeriod: 0
allowedUserTypes:
  - Person
inboundAuthConfig:
  - type: oauth2
    config:
      clientId: "{{.BROWSER_CLIENT_ID}}"
      redirectUris:
        {{- range .BROWSER_REDIRECT_URIS}}
        - {{.}}
        {{- end}}
      postLogoutRedirectUris:
        {{- range .BROWSER_REDIRECT_URIS}}
        - {{.}}
        {{- end}}
      grantTypes:
        - authorization_code
      responseTypes:
        - code
      tokenEndpointAuthMethod: none
      pkceRequired: true
      publicClient: true
      token:
        accessToken:
          userConfig:
            validityPeriod: 3600
            attributes: [given_name, family_name, email]
        idToken:
          validityPeriod: 3600
          userAttributes: [given_name, family_name, email]
          responseType: JWT
      userInfo:
        responseType: JSON
        userAttributes: [given_name, family_name, email]

