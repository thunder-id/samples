appId: com.example.flutterAppauthSample
---
# iOS asks before an app opens an authentication session ("... Wants to Use ... to Sign In"). It
# is a system alert, so dismiss it when it shows rather than wait for it.
- repeat:
    times: 3
    commands:
      - runFlow:
          when:
            visible: 'Continue'
          commands:
            - tapOn: 'Continue'
      - waitForAnimationToEnd:
          timeout: 750
