# Entrypoint workflow for releasing sample apps.
# Each selected sample is released independently: its version is bumped in its
# native manifest (package.json, pubspec.yaml, build.gradle.kts, project.pbxproj),
# committed with a new CHANGELOG.md entry, tagged, packed into a source zip and attached to a
# GitHub Release whose notes list the pull requests that changed the sample.
# Sample jobs run up to four at a time; push conflicts are handled by a retry-with-rebase
# loop in the commit step.

name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

      confirm_major:
        description: 'Check to confirm intentional major bump (required when bump_type is major)'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_android:
        description: 'quickstarts/quickstart-android'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_browser:
        description: 'quickstarts/quickstart-browser'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_express:
        description: 'quickstarts/quickstart-express'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_flutter:
        description: 'quickstarts/quickstart-flutter'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_ios:
        description: 'quickstarts/quickstart-ios'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_nextjs:
        description: 'quickstarts/quickstart-nextjs'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_nextjs_b2b:
        description: 'quickstarts/quickstart-nextjs-b2b'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_node:
        description: 'quickstarts/quickstart-node'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_nuxt:
        description: 'quickstarts/quickstart-nuxt'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_react:
        description: 'quickstarts/quickstart-react'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_react_b2b:
        description: 'quickstarts/quickstart-react-b2b'
        required: false
        type: boolean
        default: false

      sample_quickstarts_quickstart_vue:
        description: 'quickstarts/quickstart-vue'
        required: false
        type: boolean
        default: false

      sample_integrations_better_auth_nextjs:
        description: 'integrations/better-auth-nextjs'
        required: false
        type: boolean
        default: false

      sample_integrations_app_auth_flutter:
        description: 'integrations/app-auth-flutter'
        required: false
        type: boolean
        default: false

      sample_patterns_bff_react_express:
        description: 'patterns/bff-react-express'
        required: false
        type: boolean
        default: false

      sample_self_service_myaccount_react:
        description: 'self-service/myaccount-react'
        required: false
        type: boolean
        default: false

      sample_management_admin_react:
        description: 'management/admin-react'
        required: false
        type: boolean
        default: false

      sample_b2b_wayfinder_enterprise_nextjs:
        description: 'b2b/wayfinder-enterprise-nextjs'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_GIT_USER_NAME: "thunderid[bot]"
  RELEASE_GIT_USER_EMAIL: "thunderid[bot]@users.noreply.thunderid.dev"

jobs:
  validate:
    name: ✅ Validate Inputs
    runs-on: ubuntu-latest
    outputs:
      samples: ${{ steps.plan.outputs.samples }}
    steps:
      - name: Guard against accidental major bump
        if: github.event.inputs.bump_type == 'major' && github.event.inputs.confirm_major != 'true'
        run: |
          echo "❌ bump_type is 'major' but confirm_major is not checked. Enable confirm_major to proceed."
          exit 1

      # Turns the checked sample_* inputs into the release matrix.
      - name: 📋 Plan Releases
        id: plan
        env:
          sample_quickstarts_quickstart_android: ${{ github.event.inputs.sample_quickstarts_quickstart_android }}
          sample_quickstarts_quickstart_browser: ${{ github.event.inputs.sample_quickstarts_quickstart_browser }}
          sample_quickstarts_quickstart_express: ${{ github.event.inputs.sample_quickstarts_quickstart_express }}
          sample_quickstarts_quickstart_flutter: ${{ github.event.inputs.sample_quickstarts_quickstart_flutter }}
          sample_quickstarts_quickstart_ios: ${{ github.event.inputs.sample_quickstarts_quickstart_ios }}
          sample_quickstarts_quickstart_nextjs: ${{ github.event.inputs.sample_quickstarts_quickstart_nextjs }}
          sample_quickstarts_quickstart_nextjs_b2b: ${{ github.event.inputs.sample_quickstarts_quickstart_nextjs_b2b }}
          sample_quickstarts_quickstart_node: ${{ github.event.inputs.sample_quickstarts_quickstart_node }}
          sample_quickstarts_quickstart_nuxt: ${{ github.event.inputs.sample_quickstarts_quickstart_nuxt }}
          sample_quickstarts_quickstart_react: ${{ github.event.inputs.sample_quickstarts_quickstart_react }}
          sample_quickstarts_quickstart_react_b2b: ${{ github.event.inputs.sample_quickstarts_quickstart_react_b2b }}
          sample_quickstarts_quickstart_vue: ${{ github.event.inputs.sample_quickstarts_quickstart_vue }}
          sample_integrations_better_auth_nextjs: ${{ github.event.inputs.sample_integrations_better_auth_nextjs }}
          sample_integrations_app_auth_flutter: ${{ github.event.inputs.sample_integrations_app_auth_flutter }}
          sample_patterns_bff_react_express: ${{ github.event.inputs.sample_patterns_bff_react_express }}
          sample_self_service_myaccount_react: ${{ github.event.inputs.sample_self_service_myaccount_react }}
          sample_management_admin_react: ${{ github.event.inputs.sample_management_admin_react }}
          sample_b2b_wayfinder_enterprise_nextjs: ${{ github.event.inputs.sample_b2b_wayfinder_enterprise_nextjs }}
        run: |
          samples='[]'
          add() {
            if [ "${!1}" = "true" ]; then
              samples=$(jq -c --argjson s "$2" '. + [$s]' <<< "$samples")
            fi
          }
          add sample_quickstarts_quickstart_android '{"path":"quickstarts/quickstart-android","emoji":"🤖","title":"ThunderID Android Quickstart Sample"}'
          add sample_quickstarts_quickstart_browser '{"path":"quickstarts/quickstart-browser","emoji":"🌐","title":"ThunderID Browser Quickstart Sample"}'
          add sample_quickstarts_quickstart_express '{"path":"quickstarts/quickstart-express","emoji":"🚂","title":"ThunderID Express Quickstart Sample"}'
          add sample_quickstarts_quickstart_flutter '{"path":"quickstarts/quickstart-flutter","emoji":"🦋","title":"ThunderID Flutter Quickstart Sample"}'
          add sample_quickstarts_quickstart_ios '{"path":"quickstarts/quickstart-ios","emoji":"🍎","title":"ThunderID iOS Quickstart Sample"}'
          add sample_quickstarts_quickstart_nextjs '{"path":"quickstarts/quickstart-nextjs","emoji":"▲","title":"ThunderID Next.js Quickstart Sample"}'
          add sample_quickstarts_quickstart_nextjs_b2b '{"path":"quickstarts/quickstart-nextjs-b2b","emoji":"▲","title":"ThunderID Next.js B2B Quickstart Sample"}'
          add sample_quickstarts_quickstart_node '{"path":"quickstarts/quickstart-node","emoji":"🟢","title":"ThunderID Node.js Quickstart Sample"}'
          add sample_quickstarts_quickstart_nuxt '{"path":"quickstarts/quickstart-nuxt","emoji":"💚","title":"ThunderID Nuxt Quickstart Sample"}'
          add sample_quickstarts_quickstart_react '{"path":"quickstarts/quickstart-react","emoji":"⚛️","title":"ThunderID React Quickstart Sample"}'
          add sample_quickstarts_quickstart_react_b2b '{"path":"quickstarts/quickstart-react-b2b","emoji":"⚛️","title":"ThunderID React B2B Quickstart Sample"}'
          add sample_quickstarts_quickstart_vue '{"path":"quickstarts/quickstart-vue","emoji":"🟩","title":"ThunderID Vue Quickstart Sample"}'
          add sample_integrations_better_auth_nextjs '{"path":"integrations/better-auth-nextjs","emoji":"🔐","title":"ThunderID Better Auth Next.js Sample"}'
          add sample_integrations_app_auth_flutter '{"path":"integrations/app-auth-flutter","emoji":"🦋","title":"ThunderID Flutter AppAuth Sample"}'
          add sample_patterns_bff_react_express '{"path":"patterns/bff-react-express","emoji":"🛡️","title":"ThunderID React Express BFF Sample"}'
          add sample_self_service_myaccount_react '{"path":"self-service/myaccount-react","emoji":"👤","title":"ThunderID My Account Sample"}'
          add sample_management_admin_react '{"path":"management/admin-react","emoji":"🏢","title":"ThunderID Management Admin Sample"}'
          add sample_b2b_wayfinder_enterprise_nextjs '{"path":"b2b/wayfinder-enterprise-nextjs","emoji":"🧭","title":"ThunderID Wayfinder Enterprise Sample"}'
          if [ "$samples" = "[]" ]; then
            echo "❌ No sample selected. Check at least one sample_* input."
            exit 1
          fi
          echo "samples=$samples" >> "$GITHUB_OUTPUT"
          echo "Releasing: $samples"

  release:
    name: ${{ matrix.sample.emoji }} Release ${{ matrix.sample.path }}
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each release pushes to the same branch; a few at a time keeps those pushes from piling up.
      max-parallel: 4
      matrix:
        sample: ${{ fromJson(needs.validate.outputs.samples) }}
    env:
      SAMPLE_PATH: ${{ matrix.sample.path }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          # Full history and tags, so the release notes can find the sample's previous tag.
          fetch-depth: 0

      - name: 🏷️ Bump Version
        id: bump
        uses: ./.github/actions/bump-version
        with:
          path: ${{ matrix.sample.path }}
          bump_type: ${{ github.event.inputs.bump_type }}

      # The pull requests that changed the sample since its previous tag, grouped by their `Type/*`
      # label (.github/release.yml, enforced by pr-label-check.yml), in the same format as the
      # thunder-id/thunderid releases. The same notes go to the top of the sample's CHANGELOG.md.
      - name: 📝 Generate Release Notes & CHANGELOG
        id: notes
        uses: ./.github/actions/release-notes
        with:
          path: ${{ matrix.sample.path }}
          version: ${{ steps.bump.outputs.version }}
          token: ${{ secrets.THUNDERID_AUTOMATION_BOT }}

      - name: 📤 Commit, Tag & Push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "${{ env.RELEASE_GIT_USER_NAME }}"
          git config user.email "${{ env.RELEASE_GIT_USER_EMAIL }}"
          git add "${{ steps.bump.outputs.manifest }}" "${{ steps.notes.outputs.changelog }}"
          # `npm version` also bumps the version recorded in package-lock.json.
          if [ -f "${SAMPLE_PATH}/package-lock.json" ]; then git add "${SAMPLE_PATH}/package-lock.json"; fi
          git diff --cached --quiet || git commit -m "[Release] ${SAMPLE_PATH}@${VERSION}"
          # Every selected sample pushes its own commit to the same branch at about the same time.
          # A random wait between attempts stops the jobs that lost a race from retrying in step
          # with each other, which a fixed backoff does not.
          for i in $(seq 1 10); do
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }} && break
            [ "$i" -eq 10 ] && exit 1
            sleep $((i + RANDOM % 10))
          done
          git tag "sample/${SAMPLE_PATH}/v${VERSION}"
          git push origin "sample/${SAMPLE_PATH}/v${VERSION}"

      - name: 📦 Pack Sample
        id: pack
        uses: ./.github/actions/pack-sample
        with:
          path: ${{ matrix.sample.path }}
          version: ${{ steps.bump.outputs.version }}

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          VERSION: ${{ steps.bump.outputs.version }}
          TITLE: ${{ matrix.sample.title }}
        run: |
          gh release create "sample/${SAMPLE_PATH}/v${VERSION}" \
            --title "${TITLE} v${VERSION}" \
            --notes-file "${{ steps.notes.outputs.notes }}" \
            "${{ steps.pack.outputs.archive }}"
