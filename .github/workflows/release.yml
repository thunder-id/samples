# Entrypoint workflow for releasing sample apps.
# Each selected sample is released independently: its version is bumped in its
# native manifest (package.json, pubspec.yaml, build.gradle.kts, project.pbxproj),
# committed, tagged, packed into a source zip and attached to a GitHub Release.
# Sample jobs run up to four at a time; push conflicts are handled by a retry-with-rebase
# loop in the commit step.

name: 🚀 Release

on:
  workflow_dispatch:
    inputs:
      bump_type:
        description: 'Version bump type'
        required: true
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch

      confirm_major:
        description: 'Check to confirm intentional major bump (required when bump_type is major)'
        required: false
        type: boolean
        default: false

      sample_quickstarts_android:
        description: 'quickstarts/android'
        required: false
        type: boolean
        default: false

      sample_quickstarts_browser:
        description: 'quickstarts/browser'
        required: false
        type: boolean
        default: false

      sample_quickstarts_express:
        description: 'quickstarts/express'
        required: false
        type: boolean
        default: false

      sample_quickstarts_flutter:
        description: 'quickstarts/flutter'
        required: false
        type: boolean
        default: false

      sample_quickstarts_ios:
        description: 'quickstarts/ios'
        required: false
        type: boolean
        default: false

      sample_quickstarts_nextjs:
        description: 'quickstarts/nextjs'
        required: false
        type: boolean
        default: false

      sample_quickstarts_node:
        description: 'quickstarts/node'
        required: false
        type: boolean
        default: false

      sample_quickstarts_nuxt:
        description: 'quickstarts/nuxt'
        required: false
        type: boolean
        default: false

      sample_quickstarts_react:
        description: 'quickstarts/react'
        required: false
        type: boolean
        default: false

      sample_quickstarts_vue:
        description: 'quickstarts/vue'
        required: false
        type: boolean
        default: false

      sample_better_auth_nextjs:
        description: 'integrations/better-auth-nextjs'
        required: false
        type: boolean
        default: false

      sample_flutter_app_auth:
        description: 'integrations/flutter-app-auth'
        required: false
        type: boolean
        default: false

      sample_self_care_account:
        description: 'self-care/account'
        required: false
        type: boolean
        default: false

      sample_b2b_manage:
        description: 'b2b/manage'
        required: false
        type: boolean
        default: false

permissions:
  contents: write

env:
  RELEASE_GIT_USER_NAME: "thunderid[bot]"
  RELEASE_GIT_USER_EMAIL: "thunderid[bot]@users.noreply.thunderid.dev"

jobs:
  validate:
    name: ✅ Validate Inputs
    runs-on: ubuntu-latest
    outputs:
      samples: ${{ steps.plan.outputs.samples }}
    steps:
      - name: Guard against accidental major bump
        if: github.event.inputs.bump_type == 'major' && github.event.inputs.confirm_major != 'true'
        run: |
          echo "❌ bump_type is 'major' but confirm_major is not checked. Enable confirm_major to proceed."
          exit 1

      # Turns the checked sample_* inputs into the release matrix.
      - name: 📋 Plan Releases
        id: plan
        env:
          sample_quickstarts_android: ${{ github.event.inputs.sample_quickstarts_android }}
          sample_quickstarts_browser: ${{ github.event.inputs.sample_quickstarts_browser }}
          sample_quickstarts_express: ${{ github.event.inputs.sample_quickstarts_express }}
          sample_quickstarts_flutter: ${{ github.event.inputs.sample_quickstarts_flutter }}
          sample_quickstarts_ios: ${{ github.event.inputs.sample_quickstarts_ios }}
          sample_quickstarts_nextjs: ${{ github.event.inputs.sample_quickstarts_nextjs }}
          sample_quickstarts_node: ${{ github.event.inputs.sample_quickstarts_node }}
          sample_quickstarts_nuxt: ${{ github.event.inputs.sample_quickstarts_nuxt }}
          sample_quickstarts_react: ${{ github.event.inputs.sample_quickstarts_react }}
          sample_quickstarts_vue: ${{ github.event.inputs.sample_quickstarts_vue }}
          sample_better_auth_nextjs: ${{ github.event.inputs.sample_better_auth_nextjs }}
          sample_flutter_app_auth: ${{ github.event.inputs.sample_flutter_app_auth }}
          sample_self_care_account: ${{ github.event.inputs.sample_self_care_account }}
          sample_b2b_manage: ${{ github.event.inputs.sample_b2b_manage }}
        run: |
          samples='[]'
          add() {
            if [ "${!1}" = "true" ]; then
              samples=$(jq -c --argjson s "$2" '. + [$s]' <<< "$samples")
            fi
          }
          add sample_quickstarts_android '{"path":"quickstarts/android","emoji":"🤖","title":"ThunderID Android Quickstart Sample"}'
          add sample_quickstarts_browser '{"path":"quickstarts/browser","emoji":"🌐","title":"ThunderID Browser Quickstart Sample"}'
          add sample_quickstarts_express '{"path":"quickstarts/express","emoji":"🚂","title":"ThunderID Express Quickstart Sample"}'
          add sample_quickstarts_flutter '{"path":"quickstarts/flutter","emoji":"🦋","title":"ThunderID Flutter Quickstart Sample"}'
          add sample_quickstarts_ios '{"path":"quickstarts/ios","emoji":"🍎","title":"ThunderID iOS Quickstart Sample"}'
          add sample_quickstarts_nextjs '{"path":"quickstarts/nextjs","emoji":"▲","title":"ThunderID Next.js Quickstart Sample"}'
          add sample_quickstarts_node '{"path":"quickstarts/node","emoji":"🟢","title":"ThunderID Node.js Quickstart Sample"}'
          add sample_quickstarts_nuxt '{"path":"quickstarts/nuxt","emoji":"💚","title":"ThunderID Nuxt Quickstart Sample"}'
          add sample_quickstarts_react '{"path":"quickstarts/react","emoji":"⚛️","title":"ThunderID React Quickstart Sample"}'
          add sample_quickstarts_vue '{"path":"quickstarts/vue","emoji":"🟩","title":"ThunderID Vue Quickstart Sample"}'
          add sample_better_auth_nextjs '{"path":"integrations/better-auth-nextjs","emoji":"🔐","title":"ThunderID Better Auth Next.js Sample"}'
          add sample_flutter_app_auth '{"path":"integrations/flutter-app-auth","emoji":"🦋","title":"ThunderID Flutter AppAuth Sample"}'
          add sample_self_care_account '{"path":"self-care/account","emoji":"👤","title":"ThunderID Self-Care Account Sample"}'
          add sample_b2b_manage '{"path":"b2b/manage","emoji":"🏢","title":"ThunderID B2B Manage Sample"}'
          if [ "$samples" = "[]" ]; then
            echo "❌ No sample selected. Check at least one sample_* input."
            exit 1
          fi
          echo "samples=$samples" >> "$GITHUB_OUTPUT"
          echo "Releasing: $samples"

  release:
    name: ${{ matrix.sample.emoji }} Release ${{ matrix.sample.path }}
    needs: [validate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Each release pushes to the same branch; a few at a time keeps those pushes from piling up.
      max-parallel: 4
      matrix:
        sample: ${{ fromJson(needs.validate.outputs.samples) }}
    env:
      SAMPLE_PATH: ${{ matrix.sample.path }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          token: ${{ secrets.THUNDERID_AUTOMATION_BOT }}

      - name: 🏷️ Bump Version
        id: bump
        uses: ./.github/actions/bump-version
        with:
          path: ${{ matrix.sample.path }}
          bump_type: ${{ github.event.inputs.bump_type }}

      - name: 📤 Commit, Tag & Push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "${{ env.RELEASE_GIT_USER_NAME }}"
          git config user.email "${{ env.RELEASE_GIT_USER_EMAIL }}"
          git add "${{ steps.bump.outputs.manifest }}"
          # `npm version` also bumps the version recorded in package-lock.json.
          if [ -f "${SAMPLE_PATH}/package-lock.json" ]; then git add "${SAMPLE_PATH}/package-lock.json"; fi
          git diff --cached --quiet || git commit -m "[Release] ${SAMPLE_PATH}@${VERSION}"
          # Every selected sample pushes its own commit to the same branch at about the same time.
          # A random wait between attempts stops the jobs that lost a race from retrying in step
          # with each other, which a fixed backoff does not.
          for i in $(seq 1 10); do
            git pull --rebase origin ${{ github.ref_name }}
            git push origin HEAD:${{ github.ref_name }} && break
            [ "$i" -eq 10 ] && exit 1
            sleep $((i + RANDOM % 10))
          done
          git tag "sample/${SAMPLE_PATH}/v${VERSION}"
          git push origin "sample/${SAMPLE_PATH}/v${VERSION}"

      - name: 📦 Pack Sample
        id: pack
        uses: ./.github/actions/pack-sample
        with:
          path: ${{ matrix.sample.path }}
          version: ${{ steps.bump.outputs.version }}

      - name: 🚀 Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.THUNDERID_AUTOMATION_BOT }}
          VERSION: ${{ steps.bump.outputs.version }}
          TITLE: ${{ matrix.sample.title }}
        run: |
          gh release create "sample/${SAMPLE_PATH}/v${VERSION}" \
            --title "${TITLE} v${VERSION}" \
            --generate-notes \
            "${{ steps.pack.outputs.archive }}"
