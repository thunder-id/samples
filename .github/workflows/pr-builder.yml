name: 👷🛠️ PR Builder

on:
  pull_request:
    types: [opened, synchronize, reopened]
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NODE_VERSION: "lts/*"
  # Advisories that Dependency Review and the npm audit step both accept. No patched release
  # exists for either, and both are reached only through nuxt's build and dev tooling in
  # quickstarts/nuxt. Drop each once upstream ships a fix.
  #   GHSA-vfj7-8cjw-p6xm: braces stack-exhaustion DoS. Transitive via `nitropack` > `globby` >
  #     `fast-glob` > `micromatch` > `braces`, which only expands glob patterns taken from the
  #     project's own config and filesystem at build time.
  #   GHSA-86w9-cpqp-85rv: node-forge accepts extra nested DigestAlgorithm elements during RSA
  #     signature verification. Transitive via `nitropack` > `listhen` > `node-forge`, which only
  #     generates keys and self-signed certificates for the local HTTPS dev server and never
  #     verifies signatures.
  AUDIT_ALLOWED_GHSAS: GHSA-vfj7-8cjw-p6xm, GHSA-86w9-cpqp-85rv

jobs:
  dependency-review:
    name: 🔎 Dependency Review
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🔎 Dependency Review
        uses: actions/dependency-review-action@2031cfc080254a8a887f58cffee85186f0e49e48 # v4
        with:
          fail-on-severity: high
          deny-licenses: GPL-3.0-only,GPL-3.0-or-later,AGPL-3.0-only,AGPL-3.0-or-later
          allow-ghsas: ${{ env.AUDIT_ALLOWED_GHSAS }}
          # ThunderID's own Apache-2.0 package and Flutter's BSD-3-Clause material_ui, which the
          # dependency graph reports with the non-SPDX lowercase ids `apache-2.0` and
          # `bsd-3-clause`, failing the license validity check.
          allow-dependencies-licenses: pkg:pub/thunderid_flutter,pkg:pub/material_ui
          comment-summary-in-pr: always
          base-ref: ${{ github.event.pull_request.base.sha }}
          head-ref: ${{ github.event.pull_request.head.sha }}

  discover:
    name: 🔍 Discover Samples
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      node: ${{ steps.find.outputs.node }}
      flutter: ${{ steps.find.outputs.flutter }}
      android: ${{ steps.find.outputs.android }}
      ios: ${{ steps.find.outputs.ios }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      # Every <category>/<sample>/ directory at the repo root is a sample. Its stack is picked from
      # the manifest at its root: package.json (Node.js), pubspec.yaml (Flutter),
      # settings.gradle.kts (Android) or Package.swift (iOS).
      - name: 🔍 Find Samples
        id: find
        run: |
          find_samples() {
            find . -mindepth 3 -maxdepth 3 -name "$1" -not -path "./.*" -not -path "*/node_modules/*" \
              -exec dirname {} \; 2>/dev/null | sed 's#^\./##' | sort | jq -R . | jq -cs .
          }
          for stack in node:package.json flutter:pubspec.yaml android:settings.gradle.kts ios:Package.swift; do
            samples=$(find_samples "${stack#*:}")
            echo "${stack%%:*}=$samples" >> "$GITHUB_OUTPUT"
            echo "${stack%%:*} samples: $samples"
          done

  build-lint:
    name: 🔨 Build & Lint (${{ matrix.sample }})
    needs: discover
    if: ${{ needs.discover.outputs.node != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJson(needs.discover.outputs.node) }}
    defaults:
      run:
        working-directory: ${{ matrix.sample }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ⚙️ Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ matrix.sample }}/package-lock.json

      - name: 📦 Install Dependencies
        run: npm ci --no-audit --no-fund

      # npm audit has no ignore list, so high and critical advisories are checked here against
      # AUDIT_ALLOWED_GHSAS.
      - name: 🔍 Security Audit
        run: |
          npm audit --json > "${RUNNER_TEMP}/audit.json" || true
          node -e '
            const allowed = new Set(process.env.AUDIT_ALLOWED_GHSAS.split(",").map(s => s.trim()));
            const {vulnerabilities = {}} = require(process.argv[1]);
            const blocking = new Map();
            for (const [name, v] of Object.entries(vulnerabilities)) {
              for (const via of v.via) {
                if (typeof via !== "object" || !["high", "critical"].includes(via.severity)) continue;
                const id = via.url.split("/").pop();
                if (!allowed.has(id)) blocking.set(id, `${via.severity} ${id} in ${name}: ${via.title}`);
              }
            }
            for (const line of blocking.values()) console.error(line);
            process.exit(blocking.size ? 1 : 0);
          ' "${RUNNER_TEMP}/audit.json"

      # Not every sample has a formatter, a linter or a build step (e.g. the Node.js
      # server quickstarts run their sources directly), so each runs only where defined.
      - name: 🎨 Check Formatting
        run: npm run --if-present format:check

      - name: 🧹 Lint
        run: npm run --if-present lint

      - name: 🔨 Build
        run: npm run --if-present build

  build-flutter:
    name: 🦋 Analyze & Build (${{ matrix.sample }})
    needs: discover
    if: ${{ needs.discover.outputs.flutter != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJson(needs.discover.outputs.flutter) }}
    defaults:
      run:
        working-directory: ${{ matrix.sample }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ☕ Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🐦 Set up Flutter
        uses: subosito/flutter-action@4cab68ce0f1c7c924f688bff4792e044f1aeb30c # v2
        with:
          channel: stable
          cache: true

      # Samples that bundle a .env as an asset need the file present to build.
      - name: 🔐 Create .env
        run: if [ -f .env.example ] && [ ! -f .env ]; then cp .env.example .env; fi

      - name: 📦 Get Dependencies
        run: flutter pub get

      - name: 🔍 Analyze
        run: flutter analyze

      - name: 🔨 Build Android APK
        run: flutter build apk --debug

  build-android:
    name: 🤖 Build (${{ matrix.sample }})
    needs: discover
    if: ${{ needs.discover.outputs.android != '[]' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJson(needs.discover.outputs.android) }}
    defaults:
      run:
        working-directory: ${{ matrix.sample }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: ☕ Set up JDK
        uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: 🗄️ Cache Gradle
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ matrix.sample }}-${{ hashFiles(format('{0}/**/*.gradle.kts', matrix.sample), format('{0}/**/gradle-wrapper.properties', matrix.sample)) }}
          restore-keys: |
            ${{ runner.os }}-gradle-${{ matrix.sample }}-

      - name: 🔨 Build Debug APK
        run: ./gradlew assembleDebug

  build-ios:
    name: 🍎 Build (${{ matrix.sample }})
    needs: discover
    if: ${{ needs.discover.outputs.ios != '[]' }}
    runs-on: macos-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        sample: ${{ fromJson(needs.discover.outputs.ios) }}
    defaults:
      run:
        working-directory: ${{ matrix.sample }}
    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4

      - name: 🗄️ Cache Swift Packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ${{ matrix.sample }}/.build
          key: ${{ runner.os }}-swift-${{ matrix.sample }}-${{ hashFiles(format('{0}/Package.resolved', matrix.sample)) }}
          restore-keys: |
            ${{ runner.os }}-swift-${{ matrix.sample }}-

      - name: 🔨 Build
        run: swift build
