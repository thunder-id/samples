name: flutter_quickstart
description: ThunderID Flutter B2C sample — demonstrates sign-in, profile display, and sign-out.
version: 1.0.0+3
publish_to: none

environment:
  sdk: ">=3.2.0 <4.0.0"
  flutter: ">=3.16.0"

dependencies:
  flutter:
    sdk: flutter
  thunderid_flutter: ^1.2.0
  flutter_dotenv: ^5.1.0
  url_launcher: ^6.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - .env
